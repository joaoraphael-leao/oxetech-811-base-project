name: CI

# Roda os quality gates sempre que um Pull Request for aberto para a branch main.
on:
  pull_request:
    branches: [main]

# Permissao minima: o pipeline so precisa ler o codigo do repositorio.
permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      # Typecheck e build primeiro: se o projeto nem compila, nao vale a pena rodar os testes.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Roda com coverage e falha se ficar abaixo do piso definido em vitest.config.ts.
      - name: Testes com coverage
        run: npm run test:coverage

  docker-image:
    runs-on: ubuntu-latest
    # So roda se os quality gates passarem: falhar cedo economiza tempo de runner.
    needs: quality-gates
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      # Tag com o SHA do commit: sempre da pra saber qual codigo gerou a imagem.
      - name: Construir a imagem
        run: docker build -t oxetech-helpdesk:${{ github.sha }} .

      - name: Subir o container e validar o healthcheck
        run: |
          docker run -d --name api -p 3000:3000 oxetech-helpdesk:${{ github.sha }}
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Healthcheck falhou. Logs do container:"
          docker logs api
          exit 1

      - name: Encerrar o container
        if: always()
        run: docker rm -f api
